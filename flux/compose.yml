---
services:
    flux_events:
        image: ${TANSU_IMAGE}
        restart: unless-stopped
        environment:
            RUST_BACKTRACE: ${RUST_BACKTRACE}
            RUST_LOG: ${RUST_LOG}
    volumes:
        - ./etc/schema/:/schema/
        - ./data:/data/
    command: |
        --kafka-cluster-id ${CLUSTER_ID}
        --kafka-listener-url tcp://0.0.0.0:9092/
        --kafka-advertised-listener-url ${ADVERTISED_LISTENER_URL}
        --storage-engine ${STORAGE_ENGINE}
        --schema-registry file:///schema
    ports:
        - 9092:9092
        - 9100:9100
#    networks:
#        - flux_network

    flux_history:
        image: clickhouse:latest
        container_name: flux_history
        cap_add:
            - SYS_NICE
            - NET_ADMIN
            - IPC_LOCK
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        volumes:
            # /etc/clickhouse-server/config.d/*.xml - files with server configuration adjustments
            # /etc/clickhouse-server/users.d/*.xml - files with user settings adjustments
            - ./db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
            - ./ch_logs:/var/log/clickhouse-server/
            # - historydata:/var/lib/clickhouse/
            - ./historydata:/var/lib/clickhouse/
        environment:
            - CLICKHOUSE_USER=${CLICKHOUSE_USER:-skju_flux_dev}
            - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
            - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-skju_flux_dev_change_me}
#        ports:
#            - "9000:9000" # tcp clickhouse
#        networks:
#            - flux_network
        restart: unless-stopped

