[package]
name = "skju_heim"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.52.1", features = [ "full" ]}
futures = { version = "0.3.32" }
tower = {  version = "0.5.3", features = [ "full" ] }
tonic = { version = "0.14.5" }
tonic-prost = "0.14.5"
tonic-health = "0.14.5"
prost = "0.14.3"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "chrono"] }
byteorder = "1.5.0"
redis = { version = "1.2.0", features = ["connection-manager", "tokio-rustls-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
testcontainers = "0.27.3"

[build-dependencies]
tonic-prost-build = "0.14.5"
