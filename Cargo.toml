[workspace]
members = ["core", "skju_server", "mpu6500", "flux", "heim"]
exclude = ["skju_sgw", "skju_sn", "mobile/common", "proxy"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
async-trait = "0.1"
dotenvy = "0.15"
